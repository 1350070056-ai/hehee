<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Tặng Em 20/10 ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe6e8 0%, #fff1f3 50%, #ffd1d7 100%);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            position: relative;
        }

        /* Hiệu ứng trái tim bay */
        .heart {
            position: fixed;
            font-size: 20px;
            color: #ff4d6d;
            animation: float 5s linear infinite;
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Khung nội dung chính */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 35px 25px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.2);
            border: 2px solid #ffffff;
            animation: popup 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popup {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #ff2e63;
            font-size: 38px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 15px;
            color: #666;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Khung hình bó hoa bự ở giữa */
        .flower-wrapper {
            position: relative;
            display: inline-block;
            margin: 10px 0 25px 0;
        }

        .flower-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 12px 25px rgba(255, 46, 99, 0.25);
            transition: transform 0.4s ease;
            animation: pulse 3s infinite ease-in-out;
        }

        .flower-img:hover {
            transform: scale(1.05) rotate(1deg);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* Khung lời chúc */
        .wishes-card {
            background: #fff5f6;
            border-radius: 18px;
            padding: 20px;
            border: 1px dashed #ff8fa3;
            color: #4a4a4a;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
        }

        .wishes-card p {
            margin-bottom: 10px;
        }

        .highlight {
            color: #ff2e63;
            font-weight: 700;
        }

        .footer-note {
            font-size: 14px;
            color: #ff4d6d;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="container">
        <h1>Happy Vietnamese Women's Day!</h1>
        <p class="subtitle">Chúc mừng ngày 20/10 bé iuuuu ❤️</p>

        <!-- Bó hoa bự ở giữa -->
        <div class="flower-wrapper">
            <img src="bohoa.jpg" alt="Bó hoa 20/10" class="flower-img">


        <!-- Khung chứa lời chúc -->
        <div class="wishes-card">
            <p>Gửi <span class="highlight">Em</span>,</p>
            <p>Nhân ngày 20/10, chúc em luôn hạnh phúccc dui dẻ dới lại lúc nào cũng dễ thươnggg </p>
            <p>Cám mơn em đến dới anh làm anh hạnh phúc lớmmmm ✨</p>
        </div>

        <div class="footer-note">
            Forever with you ❤️
        </div>
    </div>

    <script>
        // Tạo hiệu ứng trái tim bay lơ lửng liên tục
        function createHeart() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            const icons = ['❤️', '💖', '🌸', '💐', '✨'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            container.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
